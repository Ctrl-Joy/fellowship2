<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Howlers: find your pack &amp; howl together. Communities, threads, AI with citations, live chat, polls and podcasts." />
    <meta name="theme-color" content="#0E0F11" />
    <title>Howlers · Find your pack &amp; howl together</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('howlers-theme');
          var light = t === 'light' || (t === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
