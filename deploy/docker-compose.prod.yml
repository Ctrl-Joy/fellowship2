# Strata production stack for a single VPS (see docs/DEPLOYMENT.md).
#   cp deploy/.env.example deploy/.env   # fill in every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# Optional monitoring (Prometheus + Grafana):  add  --profile monitoring
#
# Only Caddy publishes ports (80/443). Postgres, Redis, the S3 service, the backend (8080) and its management port (8081,
# /actuator/prometheus) stay on the internal network.
name: strata

x-restart: &restart
  restart: unless-stopped

services:
  caddy:
    image: caddy:2.8-alpine
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      STRATA_DOMAIN: ${STRATA_DOMAIN:?set STRATA_DOMAIN, e.g. strata.example.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificates: back this up or you'll re-issue on restore
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

  web:
    build: ../frontend
    image: ${STRATA_WEB_IMAGE:-strata-web:latest}
    <<: *restart
    depends_on:
      backend: { condition: service_healthy }

  backend:
    build: ../backend
    image: ${STRATA_BACKEND_IMAGE:-strata-backend:latest}
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError}
      APP_PUBLIC_URL: https://${STRATA_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${STRATA_DOMAIN}
      COOKIE_SECURE: "true"
      DATABASE_URL: jdbc:postgresql://postgres:5432/strata
      DATABASE_USER: ${DATABASE_USER:-strata}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-15}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -base64 48)}
      FILE_VISITOR_SALT: ${FILE_VISITOR_SALT:?set FILE_VISITOR_SALT (openssl rand -hex 32)}
      FUNDING_DEMO_WEBHOOK_SECRET: ${FUNDING_DEMO_WEBHOOK_SECRET:?set FUNDING_DEMO_WEBHOOK_SECRET (openssl rand -hex 32)}
      FUNDING_ENABLED: ${FUNDING_ENABLED:-true}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://s3:8333
      S3_CREATE_BUCKET: "true"
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-strata}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-strata}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      MANAGEMENT_PORT: "8081"
      MAIL_MODE: ${MAIL_MODE:-smtp}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM, e.g. no-reply@your-domain}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
    expose:
      - "8080"
      - "8081"   # management/metrics: reachable by Prometheus on the internal network only

  postgres:
    image: postgres:17-alpine
    <<: *restart
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: ${DATABASE_USER:-strata}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-strata} -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 256mb

  # Nightly logical backup, kept for BACKUP_KEEP_DAYS. Copy /backups off the host too (see docs/DEPLOYMENT.md).
  pgbackup:
    image: postgres:17-alpine
    <<: *restart
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${DATABASE_USER:-strata}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: strata
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backups/strata-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --no-owner --file="$$f.partial"; then
            mv "$$f.partial" "$$f" && echo "backup ok: $$f"
          else
            rm -f "$$f.partial"; echo "backup FAILED" >&2
          fi
          find /backups -name 'strata-*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for uploads (D-023): SeaweedFS, because MinIO no longer publishes public images.
  # Access is limited to the one identity below (anonymous reads get 403); the backend creates the private bucket on
  # start (S3_CREATE_BUCKET) and proxies every read, so the bucket is never exposed.
  s3:
    image: chrislusf/seaweedfs:4.55
    <<: *restart
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-strata}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"strata","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---- optional monitoring: docker compose ... --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    <<: *restart
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["monitoring"]
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.${STRATA_DOMAIN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  s3data:
  caddy_data:
  caddy_config:
  promdata:
  grafanadata:
