spring:
  application:
    name: strata
  config:
    # Local-only secrets (e.g. ANTHROPIC_API_KEY=...) in backend/.env.local, git-ignored. Absent in Docker/CI.
    import: optional:file:./.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/strata}
    username: ${DATABASE_USER:strata}
    password: ${DATABASE_PASSWORD:strata}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:15}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
  servlet:
    multipart:
      # Per-endpoint limits are enforced in code (images 10 MB, podcast media strata.storage.max-media-mb).
      max-file-size: 600MB
      max-request-size: 610MB
      file-size-threshold: 1MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # Prometheus is exposed only in prod, on the separate management port (D-026).
        include: ${MANAGEMENT_EXPOSURE:health,info}
  endpoint:
    health:
      probes:
        enabled: true
        # /livez and /readyz on the main port too, so container health checks work when management moves to its own port.
        add-additional-paths: true
      show-details: when-authorized
      group:
        # /readyz: ready only when the database and storage answer (Redis is optional: rate limits and the feed cache degrade).
        readiness:
          include: readinessState,db,storage
  metrics:
    tags:
      application: strata
    distribution:
      # Histogram buckets so Grafana can compute p95 latency (deploy/grafana/dashboards/strata-overview.json).
      percentiles-histogram:
        http.server.requests: true
  health:
    mail:
      enabled: false
    redis:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
  level:
    root: INFO
    org.hibernate.SQL: WARN

strata:
  jwt:
    # Base64, >= 32 bytes. The default is for local development only; production must set JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1iZWZvcmUtZGVwbG95aW5nLXN0cmF0YQ==}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    issuer: strata
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  app:
    public-url: ${APP_PUBLIC_URL:http://localhost:5173}
    name: Strata
  mail:
    mode: ${MAIL_MODE:log}
    from: ${MAIL_FROM:no-reply@strata.local}
  storage:
    # local | s3 (D-023). s3 works with AWS S3 and S3-compatible servers (SeaweedFS in compose); the bucket stays private and every read goes through the API.
    driver: ${STORAGE_DRIVER:local}
    local-dir: ${STORAGE_LOCAL_DIR:./data/uploads}
    s3:
      bucket: ${S3_BUCKET:strata}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style: ${S3_PATH_STYLE:false}
      # Streams larger than this are sent as multipart uploads (8 MB parts).
      multipart-threshold-mb: 8
      # Create the bucket at startup if it doesn't exist (on for the bundled SeaweedFS; off for AWS in prod).
      create-bucket: ${S3_CREATE_BUCKET:false}
    max-image-bytes: 10485760
    max-media-mb: ${MAX_MEDIA_MB:500}
  files:
    # Private files (Phase 7). Keep max-file-mb below spring.servlet.multipart.max-file-size.
    max-file-mb: ${MAX_FILE_MB:500}
    quota-mb: ${FILE_QUOTA_MB:1024}
    # Salt for hashing visitor IPs in share access logs. Blank = random per start (hashes not linkable across restarts).
    visitor-salt: ${FILE_VISITOR_SALT:}
    # Malware scanning (D-029): none (structural checks only) | clamav (clamd INSTREAM over TCP).
    antivirus: ${ANTIVIRUS:none}
    # When clamd is unreachable: true = refuse uploads (fail closed; recommended in production), false = accept them
    # as structurally checked only, labelled "Checked, not an antivirus scan" (fail open).
    antivirus-required: ${ANTIVIRUS_REQUIRED:false}
    clamav:
      host: ${CLAMAV_HOST:localhost}
      port: ${CLAMAV_PORT:3310}
      connect-timeout: ${CLAMAV_CONNECT_TIMEOUT:PT2S}
      read-timeout: ${CLAMAV_READ_TIMEOUT:PT120S}
      chunk-kb: 64
  # One-time privacy migrations (D-030). Moves DM images sent before D-024 to the private prefix at startup.
  privacy:
    migrate-legacy-dm-media: ${MIGRATE_LEGACY_DM_MEDIA:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  # First-page feed id lists cached in Redis (D-025). Only rank order is cached; posts are hydrated per viewer.
  feed-cache:
    enabled: ${FEED_CACHE_ENABLED:true}
    ttl: ${FEED_CACHE_TTL:PT30S}
  ai:
    provider: ${AI_PROVIDER:auto}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:medium}
    max-tokens: ${AI_MAX_TOKENS:16000}
  # Moderator funding (D-022). Only the demo provider exists; any other value refuses to start.
  funding:
    enabled: ${FUNDING_ENABLED:true}
    provider: ${FUNDING_PROVIDER:demo}
    # Demo webhooks are HMAC-SHA256 signed with this secret. Set your own outside local development.
    demo-webhook-secret: ${FUNDING_DEMO_WEBHOOK_SECRET:dev-only-demo-webhook-secret-change-me}
    webhook-tolerance-seconds: 300
    jobs-enabled: ${FUNDING_JOBS_ENABLED:true}
  # Write-time spam heuristics (D-021). Held content goes to the mod queue; "reject" thresholds refuse outright.
  spam:
    enabled: ${SPAM_HEURISTICS_ENABLED:true}
    new-account-age: P7D
    link-velocity:
      max-links: 5          # more links than this from a new account within the window is held
      reject-links: 20
      window: PT10M
    duplicate:
      max-communities: 3    # same content in this many communities within the window is held
      reject-communities: 6
      window: PT1H
      cross-account-min-body: 40
    burst:
      max-items: 8          # posts + comments from a new account within the window
      reject-items: 30
      window: PT5M
    mentions:
      max: 8                # distinct @mentions in one post or comment
      reject: 25

---
spring:
  config:
    activate:
      on-profile: prod
strata:
  cookie:
    secure: true
  seed:
    enabled: ${SEED_DEMO_DATA:false}
  files:
    # Fail closed in production when ClamAV is enabled but unreachable (D-029).
    antivirus-required: ${ANTIVIRUS_REQUIRED:true}
# Metrics and the full actuator live on a separate port that is never published (Caddy/nginx only proxy 8080).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_EXPOSURE:health,info,prometheus}
# One JSON object per line (Elastic Common Schema), including the request's traceId from the MDC.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
