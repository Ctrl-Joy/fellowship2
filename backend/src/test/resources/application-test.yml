strata:
  ai:
    provider: offline
  rate-limit:
    enabled: false
  seed:
    enabled: false
  feed-cache:
    enabled: false   # FeedCacheIT switches it on with an in-memory store
  spam:
    enabled: false   # tests that exercise a heuristic switch it on through SpamProperties and restore it
  storage:
    local-dir: ./target/test-uploads
  funding:
    # Tests drive the recurring-charge and close jobs directly, with explicit timestamps.
    jobs-enabled: false
  files:
    max-file-mb: 2
    quota-mb: 4
management:
  health:
    redis:
      enabled: false
logging:
  level:
    root: WARN
