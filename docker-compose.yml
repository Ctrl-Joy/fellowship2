# Strata — local/full-stack environment.  `cp .env.example .env && docker compose up --build`
# Then open http://localhost:${WEB_PORT:-8088}. API docs: http://localhost:${WEB_PORT:-8088}/swagger-ui.html
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: ${DATABASE_USER:-strata}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-strata} -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage for uploads (D-023): SeaweedFS, because MinIO no longer publishes public images.
  # Access is limited to the one identity below (anonymous reads get 403); the backend creates the private bucket on
  # start (S3_CREATE_BUCKET) and proxies every read, so the bucket is never exposed.
  s3:
    image: chrislusf/seaweedfs:4.55
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-strata}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"strata","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DATABASE_URL: jdbc:postgresql://postgres:5432/strata
      DATABASE_USER: ${DATABASE_USER:-strata}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8088}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      MAIL_MODE: ${MAIL_MODE:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@strata.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Howlers}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Storage: the S3 bucket by default; STORAGE_DRIVER=local keeps files in the uploads volume instead.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: http://s3:8333
      S3_CREATE_BUCKET: "true"
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-strata}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-strata}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      FILE_VISITOR_SALT: ${FILE_VISITOR_SALT:-}
      FUNDING_DEMO_WEBHOOK_SECRET: ${FUNDING_DEMO_WEBHOOK_SECRET:-dev-only-demo-webhook-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  s3data:
