# Strata — local/full-stack environment.  `cp .env.example .env && docker compose up --build`
# Then open http://localhost:${WEB_PORT:-8088}. API docs: http://localhost:${WEB_PORT:-8088}/swagger-ui.html
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: strata
      POSTGRES_USER: ${DATABASE_USER:-strata}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-strata} -d strata"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Optional S3-compatible object storage (D-023), enabled with `--profile s3` and STORAGE_DRIVER=s3.
  # MinIO stopped publishing public images (Docker Hub and quay.io both refuse anonymous pulls), so the image is
  # configurable: point MINIO_IMAGE / MINIO_MC_IMAGE at a mirror or a build you trust. Without the profile, uploads
  # use the local `uploads` volume. The bucket is private; the API proxies every read.
  minio:
    profiles: ["s3"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-strata}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - miniodata:/data
    # ports: ["9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket and make sure it has no anonymous access, then exit.
  minio-init:
    profiles: ["s3"]
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2024-11-21T17-21-54Z}
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-strata}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-strata}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"
    restart: "no"

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      # Only waited for when the s3 profile is enabled.
      minio-init: { condition: service_completed_successfully, required: false }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DATABASE_URL: jdbc:postgresql://postgres:5432/strata
      DATABASE_USER: ${DATABASE_USER:-strata}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:8088}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8088}
      MAIL_MODE: ${MAIL_MODE:-log}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      # Storage: the local uploads volume by default; STORAGE_DRIVER=s3 with `--profile s3` uses the bucket instead.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: http://minio:9000
      S3_PATH_STYLE: "true"
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-strata}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-strata}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FILE_VISITOR_SALT: ${FILE_VISITOR_SALT:-}
      FUNDING_DEMO_WEBHOOK_SECRET: ${FUNDING_DEMO_WEBHOOK_SECRET:-dev-only-demo-webhook-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  miniodata:
